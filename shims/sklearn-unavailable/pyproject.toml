# 只給 Windows on ARM 的 GPU 環境用：install.ps1 先裝真的 scikit-learn，被 Smart App Control 擋下才裝這個。
# librosa 0.9.2 一 import 就要 sklearn 的幾個子模組存在，但生成路徑（load、effects.trim）從不呼叫它們。
[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sklearn-unavailable"
version = "0.1.0"
description = "Import-time stand-in for scikit-learn where Smart App Control blocks its native modules"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["sklearn"]
